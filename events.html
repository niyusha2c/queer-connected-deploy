document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt }}<\/span>\n      <\/div>\n      <div class=\"ev-grid\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px\">\n        <sc-for list=\"{{ cardList }}\" as=\"ev\" hint-placeholder-count=\"6\">\n            <div class=\"ev-card\" style=\"display:flex;flex-direction:column;background:#FFF9F4;border-radius:16px;overflow:hidden;border:1px solid rgba(20,17,15,.07);box-shadow:0 10px 26px rgba(20,17,15,.07);transition:transform .15s ease,box-shadow .15s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 18px 36px rgba(20,17,15,.12)\">\n              <div style=\"position:relative;aspect-ratio:8/5;background:#14110F;overflow:hidden\">\n                <div role=\"img\" aria-label=\"{{ ev.title }}\" style=\"{{ ev.imgStyle }}\"><\/div>\n                <span style=\"position:absolute;top:12px;left:12px;padding:7px 13px;border-radius:999px;background:#FFF9F4;color:#D95F2B;font:600 12px/1 Karla,sans-serif;box-shadow:0 2px 8px rgba(20,17,15,.15)\">{{ ev.cat }}<\/span>\n              <\/div>\n              <div style=\"padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1\">\n                <h3 style=\"margin:0 0 2px;font:700 20px/1.2 Bricolage Grotesque,sans-serif;letter-spacing:-.02em;color:#14110F\">{{ ev.title }}<\/h3>\n                <div style=\"display:flex;align-items:flex-start;gap:9px;font:400 14px/1.45 Karla,sans-serif;color:#5E3520\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D95F2B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><line x1=\"16\" y1=\"3\" x2=\"16\" y2=\"7\"><\/line><line x1=\"8\" y1=\"3\" x2=\"8\" y2=\"7\"><\/line><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\/line><\/svg>\n                  <span>{{ ev.when }}<\/span>\n                <\/div>\n                <sc-if value=\"{{ ev.hasVenue }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:flex-start;gap:9px;font:400 14px/1.45 Karla,sans-serif;color:#5E3520\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D95F2B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z\"><\/path><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"><\/circle><\/svg>\n                  <span>{{ ev.venue }}<\/span>\n                <\/div>\n                <\/sc-if>\n                <span style=\"{{ ev.btnStyle }}\" style-hover=\"{{ ev.btnHover }}\">{{ ev.btnLabel }}<\/span>\n              <\/div>\n            <\/div>\n\n        <\/sc-for>\n      <\/div>\n      <sc-if value=\"{{ listEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-radius:16px;background:#FFF9F4;padding:30px 26px\">\n          <p style=\"margin:0;font:400 15px/1.6 Karla,sans-serif;color:#94664A\">Nothing matches yet. Running something? <a href=\"#list\">Pin it to the board.<\/a><\/p>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{ isMonth }}\" hint-placeholder-val=\"{{ false }}\">\n    <sc-if value=\"{{ hasDaySelected }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"sec44\" style=\"padding:6px 44px 50px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:10px 0 18px\">\n        <h2 style=\"margin:0;font:800 28px/1 Bricolage Grotesque,sans-serif;letter-spacing:-.03em;color:#14110F\">{{ dayLabel }}<\/h2>\n        <span style=\"font:500 10px JetBrains Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:#94664A;white-space:nowrap\">{{ dayCount }}<\/span>\n      <\/div>\n      <div class=\"ev-grid\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px\">\n        <sc-for list=\"{{ dayEventsList }}\" as=\"ev\" hint-placeholder-count=\"2\">\n            <div class=\"ev-card\" style=\"display:flex;flex-direction:column;background:#FFF9F4;border-radius:16px;overflow:hidden;border:1px solid rgba(20,17,15,.07);box-shadow:0 10px 26px rgba(20,17,15,.07);transition:transform .15s ease,box-shadow .15s ease\" style-hover=\"transform:translateY(-3px);box-shadow:0 18px 36px rgba(20,17,15,.12)\">\n              <div style=\"position:relative;aspect-ratio:8/5;background:#14110F;overflow:hidden\">\n                <div role=\"img\" aria-label=\"{{ ev.title }}\" style=\"{{ ev.imgStyle }}\"><\/div>\n                <span style=\"position:absolute;top:12px;left:12px;padding:7px 13px;border-radius:999px;background:#FFF9F4;color:#D95F2B;font:600 12px/1 Karla,sans-serif;box-shadow:0 2px 8px rgba(20,17,15,.15)\">{{ ev.cat }}<\/span>\n              <\/div>\n              <div style=\"padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1\">\n                <h3 style=\"margin:0 0 2px;font:700 20px/1.2 Bricolage Grotesque,sans-serif;letter-spacing:-.02em;color:#14110F\">{{ ev.title }}<\/h3>\n                <div style=\"display:flex;align-items:flex-start;gap:9px;font:400 14px/1.45 Karla,sans-serif;color:#5E3520\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D95F2B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><line x1=\"16\" y1=\"3\" x2=\"16\" y2=\"7\"><\/line><line x1=\"8\" y1=\"3\" x2=\"8\" y2=\"7\"><\/line><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\/line><\/svg>\n                  <span>{{ ev.when }}<\/span>\n                <\/div>\n                <sc-if value=\"{{ ev.hasVenue }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:flex-start;gap:9px;font:400 14px/1.45 Karla,sans-serif;color:#5E3520\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D95F2B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z\"><\/path><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"><\/circle><\/svg>\n                  <span>{{ ev.venue }}<\/span>\n                <\/div>\n                <\/sc-if>\n                <span style=\"{{ ev.btnStyle }}\" style-hover=\"{{ ev.btnHover }}\">{{ ev.btnLabel }}<\/span>\n              <\/div>\n            <\/div>\n\n        <\/sc-for>\n      <\/div>\n      <sc-if value=\"{{ dayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-radius:16px;background:#FFF9F4;padding:30px 26px\">\n          <p style=\"margin:0;font:400 15px/1.6 Karla,sans-serif;color:#94664A\">Nothing on this day yet. Running something? <a href=\"#list\">Pin it to the board.<\/a><\/p>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ noDaySelected }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"sec44\" style=\"padding:6px 44px 46px\">\n      <div style=\"border-radius:16px;background:#FFF9F4;padding:30px 26px;display:flex;align-items:center;justify-content:center\">\n        <p style=\"margin:0;font:500 12px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#94664A\">Tap a day to see what's on<\/p>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n  <\/sc-if>\n\n  <div id=\"list\" class=\"sec44 cta-grid-events\" style=\"padding:0 44px 46px;display:grid;grid-template-columns:1.05fr .95fr;gap:1px;background:rgba(20,17,15,.18)\">\n    <div style=\"background:linear-gradient(105deg,#DA612E,#F4A46B);padding:44px 42px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:500 11px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#FFE7D6\">Run something?<\/span>\n      <h2 class=\"cta-h2-events\" style=\"margin:0;font:800 46px/.94 Bricolage Grotesque,sans-serif;letter-spacing:-.035em;color:#FFF9F4\">Pin it to<br>the board<\/h2>\n      <p style=\"margin:0;max-width:400px;font:400 17px/1.6 Karla,sans-serif;color:#FFEFE3\">Club night, craft group, support circle, choir. Free to list, always.<\/p>\n      <span style=\"margin-top:8px;padding:15px 26px;background:#14110F;color:#F4A46B;font:600 15px Karla,sans-serif;align-self:flex-start\">List your event<\/span>\n    <\/div>\n    <div style=\"background:#14110F;padding:44px 42px;display:flex;flex-direction:column;gap:14px;justify-content:center\">\n      <span style=\"font:500 11px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#F4A46B\">Never miss one<\/span>\n      <h2 class=\"cta-h2-events\" style=\"margin:0;font:800 38px/.98 Bricolage Grotesque,sans-serif;letter-spacing:-.035em;color:#FFF9F4\">A quiet weekly email<\/h2>\n      <p style=\"margin:0;font:400 17px/1.6 Karla,sans-serif;color:#B8ADA4\">What's on near you, once a week. Nothing else, ever.<\/p>\n      <div style=\"display:flex;gap:10px;margin-top:8px\">\n        <span style=\"flex:1;padding:16px 18px;background:#241F1B;border:1px solid rgba(242,238,231,.2);font:400 16px Karla,sans-serif;color:#8A7F76\">you@email.com<\/span>\n        <span style=\"padding:16px 26px;background:#F4A46B;color:#14110F;font:700 16px Karla,sans-serif\">Notify me<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sec44 footer\" style=\"background:#FFF9F4;border-top:1px solid rgba(20,17,15,.18);padding:34px 44px;display:flex;align-items:center;justify-content:space-between;gap:30px\">\n    <div class=\"footer-brand\" style=\"display:flex;align-items:center;gap:20px\">\n      <a href=\"index.html\" style=\"display:flex;align-items:center;text-decoration:none\">\n        <img src=\"2d8ba034-2cb8-4e1d-ae00-7c424d7c7179\" alt=\"Queer Connected\" style=\"height:48px;width:auto\">\n      <\/a>\n      <span style=\"font:400 13px/1.6 Karla,sans-serif;color:#9A6A4C\">\u00a9 2026 Queer Connected<br>queerconnected.com<\/span>\n    <\/div>\n    <div class=\"footer-nav\" style=\"display:flex;gap:22px;font:500 11px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#3B332D\">\n      <a href=\"index.html\" style=\"color:inherit;text-decoration:none\">Home<\/a><a href=\"about.html\" style=\"color:inherit;text-decoration:none\">About<\/a><a href=\"events.html\" style=\"color:inherit;text-decoration:none\">Events<\/a><span>FAQs<\/span><span>Contact<\/span><span>Instagram<\/span><span>TikTok<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cards&quot;,&quot;month&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showPastDays&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\nconst WD_SUN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst TODAY = new Date();\nconst CUR_Y = TODAY.getFullYear(), CUR_M = TODAY.getMonth(), CUR_D = TODAY.getDate();\nfunction monthMeta(y, m, todayDay) {\n  return {\n    year: y, monthIndex: m,\n    label: `${MONTH_SHORT[m]} ${y}`,\n    short: MONTH_SHORT[m],\n    full: MONTH_FULL[m],\n    days: new Date(y, m + 1, 0).getDate(),\n    lead: (new Date(y, m, 1).getDay() + 6) % 7,\n    today: todayDay\n  };\n}\nfunction monthAt(offset) {\n  const totalM = CUR_M + offset;\n  const y = CUR_Y + Math.floor(totalM / 12);\n  const m = ((totalM % 12) + 12) % 12;\n  return monthMeta(y, m, offset === 0 ? CUR_D : null);\n}\nconst pad = n => String(n).padStart(2, '0');\nconst iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;\nconst dayKey = dt => iso(dt.getFullYear(), dt.getMonth(), dt.getDate());\nconst hm = dt => `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;\nconst dLabel = dt => `${WD_SUN[dt.getDay()]} ${dt.getDate()} ${MONTH_SHORT[dt.getMonth()]}`;\n\n// Events as listed on queerconnected.com (30 Sep 2026). Art is cropped from a screenshot\n// of the live site as a stand-in \u2014 replace with the hosts' original images.\n// start/end: [year, monthIndex (0 = Jan), day, hour, minute]\nconst EVENTS = [\n  {title:'Spin Cycle: The Lesbian Launderette Play', cat:'Group Activities', city:'London', venue:'Lower Marsh Arts Club (LowMAC), Lower Marsh, London, UK', start:[2026,8,30,19,0], end:[2026,9,12,20,0], img:'94dab1a3-8286-4cb7-ba6d-3a37886a83c5', soldOut:true},\n  {title:'Sapphic Mixer', cat:'Dating', city:'Cardiff', venue:'The Underdog, Guildhall Place, Cardiff, UK', start:[2026,9,16,19,0], end:[2026,9,16,23,0], img:'e33d333c-dbbc-4256-b905-c6f6324189bb'},\n  {title:'Dapper Dyke Halloween', cat:'Social', city:'London', venue:'Chats Palace, Brooksby\u2019s Walk, London, UK', start:[2026,9,23,19,0], end:[2026,9,24,1,0], img:'8bd0f830-1b0c-4da4-a5f9-15a2bf420b7a'},\n  {title:'Spooky Sapphic Night', cat:'Social', city:'London', venue:'The Ministry, Borough, London, UK', start:[2026,9,23,20,30], end:[2026,9,24,2,0], img:'9a33a9bb-2112-44ab-a0ed-b3eeab0fcd47'},\n  {title:'SUCCUBUS: The Queer Cannibal Comedy', cat:'Group Activities', city:'', venue:'', start:[2026,9,13,19,0], end:[2026,9,13,20,0], img:'f8cdacb6-1b0c-4570-bb29-61d0665df510'},\n  {title:'SUCCUBUS: The Queer Cannibal Comedy', cat:'Arts & Crafts', city:'', venue:'', start:[2026,9,14,19,0], end:[2026,9,14,21,0], img:'bdbe5f9d-eb93-4d2c-9128-f0f020a372e6'}\n].map((e, i) => {\n  const s = new Date(...e.start.slice(0, 3), e.start[3], e.start[4]);\n  const en = new Date(...e.end.slice(0, 3), e.end[3], e.end[4]);\n  // Days the event appears on: start day to end day; an end before 6am counts as the night before.\n  const last = new Date(en.getFullYear(), en.getMonth(), en.getDate() - (en.getHours() < 6 && dayKey(en) !== dayKey(s) ? 1 : 0));\n  const days = [];\n  for (let d = new Date(s.getFullYear(), s.getMonth(), s.getDate()); d <= last; d.setDate(d.getDate() + 1)) days.push(dayKey(d));\n  const sameDay = days.length === 1;\n  const when = sameDay ? `${dLabel(s)}, ${hm(s)} \u2013 ${hm(en)}` : `${dLabel(s)}, ${hm(s)} \u2013 ${dLabel(en)}, ${hm(en)}`;\n  return Object.assign({}, e, { id: i, s, en, days, when, time: hm(s) });\n}).sort((a, b) => a.s - b.s);\n\nconst CATEGORIES = ['Arts & Crafts','Charity','Club','Community','Dating','Games','Group Activities','Music','Networking','Pub Quiz','Sober Events','Social','Sports'];\n\nclass Component extends DCLogic {\n  state = { view: null, month: 0, date: null, locationQuery: '', categoryFilter: null };\n\n  get view() { return this.state.view || this.props.defaultView || 'cards'; }\n  get showPast() { return this.props.showPastDays ?? true; }\n\n  matches(e) {\n    const q = this.state.locationQuery.trim().toLowerCase();\n    return (!q || e.city.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q)) && (!this.state.categoryFilter || e.cat === this.state.categoryFilter);\n  }\n  onDay(key) { return EVENTS.filter(e => e.days.includes(key) && this.matches(e)); }\n\n  card(e) {\n    return {\n      title: e.title, cat: e.cat, imgStyle: `position:absolute;inset:0;background:#14110F url(${e.img}) center/cover no-repeat`, when: e.when, venue: e.venue, hasVenue: !!e.venue,\n      btnLabel: e.soldOut ? 'Sold out' : 'Get ticket',\n      btnStyle: e.soldOut\n        ? 'margin-top:auto;display:block;text-align:center;padding:13px 16px;border-radius:10px;font:700 15px Karla,sans-serif;background:#EFE3D8;color:#94664A;cursor:default'\n        : 'margin-top:auto;display:block;text-align:center;padding:13px 16px;border-radius:10px;font:700 15px Karla,sans-serif;background:#D95F2B;color:#FFF9F4;cursor:pointer',\n      btnHover: e.soldOut ? '' : 'background:#B94C1F'\n    };\n  }\n\n  pickDate(key) {\n    if (!key) return this.setState({ date: null });\n    const [y, m] = key.split('-').map(Number);\n    this.setState({ date: key, month: (y - CUR_Y) * 12 + (m - 1 - CUR_M) });\n  }\n\n  renderVals() {\n    const st = this.state;\n    const M = monthAt(st.month);\n    const todayKey = iso(CUR_Y, CUR_M, CUR_D);\n\n    const cells = [];\n    const rows = Math.ceil((M.lead + M.days) / 7);\n    for (let i = 0; i < rows * 7; i++) {\n      const n = i - M.lead + 1;\n      if (n < 1 || n > M.days) {\n        cells.push({ n: '', style: 'height:96px;background:transparent', numStyle: 'display:none', todayStyle: 'display:none', todayLabel: '', lines: [], hoverStyle: '', onClick: () => {}, moreLabel: '', moreStyle: 'display:none' });\n        continue;\n      }\n      const key = iso(M.year, M.monthIndex, n);\n      const evs = this.onDay(key);\n      const sel = st.date === key;\n      const past = this.showPast && key < todayKey;\n      const shown = evs.slice(0, 2);\n      const extra = evs.length - shown.length;\n      cells.push({\n        n,\n        onClick: () => this.setState({ date: sel ? null : key }),\n        style: `height:96px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;cursor:pointer;border-radius:10px;background:${sel ? '#FCDCC4' : '#FDF1E7'};border:1px solid ${sel ? 'rgba(217,95,43,.35)' : 'transparent'};opacity:${past && !sel ? .55 : 1}`,\n        hoverStyle: sel ? '' : 'background:rgba(217,95,43,.14)',\n        numStyle: `font:700 15px/1 Bricolage Grotesque,sans-serif;color:${sel ? '#D95F2B' : '#14110F'}`,\n        todayLabel: key === todayKey ? 'Today' : '',\n        todayStyle: key === todayKey\n          ? `font:700 8px/1 JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;padding:3px 5px;border-radius:4px;white-space:nowrap;color:#FFF9F4;background:#D95F2B`\n          : 'display:none',\n        lines: shown.map(e => ({\n          time: e.days[0] === key ? e.time : 'On', title: e.title,\n          style: `display:flex;flex-direction:column;gap:2px;padding-left:8px;border-left:2px solid #D95F2B;min-width:0`,\n          timeStyle: `font:500 9px/1 JetBrains Mono,monospace;color:#94664A`,\n          titleStyle: `font:500 11px/1.25 Karla,sans-serif;color:#5E3520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0`\n        })),\n        moreLabel: extra > 0 ? `+${extra} more` : '',\n        moreStyle: extra > 0 ? `font:600 9px/1 JetBrains Mono,monospace;letter-spacing:.06em;color:${sel ? '#D95F2B' : '#94664A'};padding-left:8px` : 'display:none'\n      });\n    }\n\n    // Cards view: upcoming events, or everything on the picked date.\n    const list = st.date\n      ? this.onDay(st.date)\n      : EVENTS.filter(e => e.en >= TODAY && this.matches(e));\n    const dateObj = st.date ? new Date(...st.date.split('-').map((v, i) => i === 1 ? v - 1 : +v)) : null;\n    const dayEvs = st.date ? this.onDay(st.date) : [];\n    const n = list.length;\n\n    const tab = on => `padding:11px 20px;cursor:pointer;background:${on ? '#D95F2B' : 'transparent'};color:${on ? '#FFF9F4' : '#14110F'}`;\n\n    return {\n      weekdays: WD,\n      monthLabel: M.label,\n      prevMonth: () => this.setState(s => ({ month: s.month - 1 })),\n      nextMonth: () => this.setState(s => ({ month: s.month + 1 })),\n      locationQuery: st.locationQuery,\n      setLocationQuery: (e) => this.setState({ locationQuery: (e && e.target && e.target.value) || '' }),\n      categoryOptions: CATEGORIES,\n      categoryFilter: st.categoryFilter || '',\n      setCategory: (e) => this.setState({ categoryFilter: (e && e.target && e.target.value) || null }),\n      dateValue: st.date || '',\n      setDate: (e) => this.pickDate((e && e.target && e.target.value) || null),\n      clearDate: () => this.setState({ date: null }),\n      hasDate: !!st.date,\n      dateInputStyle: `width:100%;box-sizing:border-box;padding:10px 14px;min-height:40px;border:1px solid ${st.date ? 'rgba(217,95,43,.55)' : 'rgba(20,17,15,.08)'};border-radius:9px;background:${st.date ? '#FCDCC4' : '#FDF1E7'};color:#14110F;font:500 12px JetBrains Mono,monospace;letter-spacing:.04em;cursor:pointer`,\n      filtersStyle: `display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;${this.view === 'month' ? 'padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid rgba(20,17,15,.08)' : ''}`,\n      showCards: () => this.setState({ view: 'cards' }),\n      showMonth: () => this.setState({ view: 'month' }),\n      isCards: this.view === 'cards', isMonth: this.view === 'month',\n      tabCardsStyle: tab(this.view === 'cards'),\n      tabMonthStyle: tab(this.view === 'month'),\n      cells,\n      listHeading: dateObj ? `${WD_SUN[dateObj.getDay()]} ${dateObj.getDate()} ${MONTH_FULL[dateObj.getMonth()]}` : 'Upcoming events',\n      listCount: `${n} ${n === 1 ? 'event' : 'events'}`,\n      cardList: list.map(e => this.card(e)),\n      listEmpty: n === 0,\n      dayLabel: dateObj ? `${WD_SUN[dateObj.getDay()]} ${dateObj.getDate()} ${MONTH_FULL[dateObj.getMonth()]}` : '',\n      dayCount: dayEvs.length ? `${dayEvs.length} ${dayEvs.length === 1 ? 'event' : 'events'}` : 'Free day',\n      dayEmpty: dayEvs.length === 0,\n      hasDaySelected: !!st.date,\n      noDaySelected: !st.date,\n      dayEventsList: dayEvs.map(e => this.card(e))\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
