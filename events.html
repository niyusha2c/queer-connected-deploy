  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-weight: 700;\n  font-display: swap;\n  src: url(\"718c4c38-9268-4fe8-8c28-0c91646b5213\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Karla';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b8d09c00-7c9d-44e6-9352-80854d63fb58\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#FDF1E7;font-family:Karla,system-ui,sans-serif}\na{color:#D95F2B}a:hover{color:#8F3C18}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;max-width:100%;background:#FDF1E7;font-family:Karla,sans-serif;overflow:hidden\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 48px;background:#FFF9F4;border-bottom:1px solid rgba(20,17,15,.18)\">\n    <a href=\"index.html\" style=\"display:flex;align-items:center;gap:14px;text-decoration:none\">\n      <img src=\"2d8ba034-2cb8-4e1d-ae00-7c424d7c7179\" alt=\"Queer Connected\" style=\"height:44px;width:auto;filter:none\">\n      <div style=\"display:flex;flex-direction:column;gap:5px;align-items:flex-start\">\n        <img src=\"bb209a64-c851-4831-ade7-4d6aa8d21e8c\" alt=\"Queer Connected\" style=\"height:19px;width:auto;filter:none\">\n        <img src=\"feec71b5-b0d3-43d8-82c7-57f01240a27e\" alt=\"Find your space\" style=\"height:13px;width:auto;margin-left:2px;filter:none\">\n      <\u002Fdiv>\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:28px;font:500 12px/1 JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:#3B332D\">\n      <a href=\"index.html\" style=\"color:inherit;text-decoration:none\">Home<\u002Fa><span>About<\u002Fspan><a href=\"events.html\" style=\"color:#D95F2B;text-decoration:none\">Events<\u002Fa><span>FAQs<\u002Fspan><span>Contact<\u002Fspan>\n      <span style=\"padding:12px 22px;background:#D95F2B;color:#FFF9F4;border-radius:2px;font-weight:700\">Get early access<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:34px 44px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:36px\">\n    <div style=\"display:flex;flex-direction:column;gap:9px\">\n      \n      <h1 style=\"margin:0;font:800 62px/.88 Bricolage Grotesque,sans-serif;letter-spacing:-.045em;color:#14110F\">Events<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:22px;padding-bottom:6px\">\n      <div style=\"display:flex;align-items:center;font:500 11px JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase\">\n        <span sc-camel-on-click=\"{{ prevMonth }}\" style=\"padding:11px 16px;border:1px solid rgba(20,17,15,.28);color:#14110F;cursor:pointer\" style-hover=\"background:rgba(217,95,43,.1)\">‹<\u002Fspan>\n        <span style=\"padding:11px 20px;border:1px solid rgba(20,17,15,.28);border-left:none;border-right:none;background:#14110F;color:#FFF9F4;min-width:104px;text-align:center\">{{ monthLabel }}<\u002Fspan>\n        <span sc-camel-on-click=\"{{ nextMonth }}\" style=\"padding:11px 16px;border:1px solid rgba(20,17,15,.28);color:#14110F;cursor:pointer\" style-hover=\"background:rgba(217,95,43,.1)\">›<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;font:600 11px JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase\">\n        <span sc-camel-on-click=\"{{ showMonth }}\" style=\"{{ tabMonthStyle }}\">Month<\u002Fspan>\n        <span sc-camel-on-click=\"{{ showRibbon }}\" style=\"{{ tabRibbonStyle }}\">Ribbon<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isMonth }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:6px 44px 0\">\n      <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px\">\n        <sc-for list=\"{{ weekdays }}\" as=\"wd\" hint-placeholder-count=\"7\">\n          <span style=\"font:700 10px/1 JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#94664A;padding-bottom:4px\">{{ wd }}<\u002Fspan>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ cells }}\" as=\"cell\" hint-placeholder-count=\"35\">\n          <div sc-camel-on-click=\"{{ cell.onClick }}\" style=\"{{ cell.style }}\" style-hover=\"{{ cell.hoverStyle }}\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:6px\">\n              <span style=\"{{ cell.numStyle }}\">{{ cell.n }}<\u002Fspan>\n              <span style=\"{{ cell.todayStyle }}\">{{ cell.todayLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ cell.lines }}\" as=\"line\" hint-placeholder-count=\"0\">\n              <div style=\"{{ line.style }}\">\n                <span style=\"{{ line.timeStyle }}\">{{ line.time }}<\u002Fspan>\n                <span style=\"{{ line.titleStyle }}\">{{ line.title }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <span style=\"{{ cell.moreStyle }}\">{{ cell.moreLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasDaySelected }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:26px 44px 46px\">\n      <div style=\"border:1px solid rgba(20,17,15,.5);padding:24px 26px 26px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:15px;border-bottom:1px solid rgba(20,17,15,.2)\">\n          <h2 style=\"margin:0;font:800 28px/1 Bricolage Grotesque,sans-serif;letter-spacing:-.03em;color:#14110F\">{{ dayLabel }}<\u002Fh2>\n          <span style=\"font:500 10px JetBrains Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:#94664A;white-space:nowrap\">{{ dayCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0\">\n          <sc-for list=\"{{ dayEventsList }}\" as=\"ev\" hint-placeholder-count=\"2\">\n            <div style=\"{{ ev.trayStyle }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <span style=\"font:700 9px/1 JetBrains Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:#D95F2B\">{{ ev.kind }}<\u002Fspan>\n                <span style=\"font:500 11px JetBrains Mono,monospace;color:#5E3520;white-space:nowrap\">{{ ev.time }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"margin:0;font:600 20px/1.2 Bricolage Grotesque,sans-serif;letter-spacing:-.018em;color:#14110F\">{{ ev.title }}<\u002Fh3>\n              <span style=\"font:400 13px/1.5 Karla,sans-serif;color:#5E3520\">{{ ev.venue }}<\u002Fspan>\n              <span style=\"font:500 10px JetBrains Mono,monospace;letter-spacing:.1em;text-transform:uppercase;color:#94664A\">{{ ev.access }}<\u002Fspan>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px\">\n                <span style=\"font:500 10px JetBrains Mono,monospace;color:#94664A;white-space:nowrap\">{{ ev.goingLabel }}<\u002Fspan>\n                <span sc-camel-on-click=\"{{ ev.onGoing }}\" style=\"{{ ev.btnStyle }}\">{{ ev.btnLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ dayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font:400 15px/1.6 Karla,sans-serif;color:#94664A\">Nothing on this day yet. Running something? <a href=\"#list\">Pin it to the board.<\u002Fa><\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noDaySelected }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:26px 44px 46px\">\n      <div style=\"border:1px dashed rgba(20,17,15,.3);padding:30px 26px;display:flex;align-items:center;justify-content:center\">\n        <p style=\"margin:0;font:500 12px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#94664A\">Tap a day to see what's on<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRibbon }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:6px 44px 0;display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between\">\n        <span style=\"font:500 10px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#94664A\">1 {{ monthLabel }}<\u002Fspan>\n        <span style=\"font:600 12px JetBrains Mono,monospace;letter-spacing:.08em;text-transform:uppercase;color:#D95F2B;white-space:nowrap\">{{ ribbonLabel }}<\u002Fspan>\n        <span style=\"font:500 10px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#94664A\">{{ lastDayLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:3px;height:48px;padding-bottom:7px;border-bottom:1px solid rgba(20,17,15,.2)\">\n        <sc-for list=\"{{ scrub }}\" as=\"bar\" hint-placeholder-count=\"30\">\n          <span sc-camel-on-click=\"{{ bar.onClick }}\" style=\"{{ bar.style }}\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:10px;overflow-x:auto;padding:22px 44px 46px;scroll-snap-type:x mandatory\">\n      <sc-for list=\"{{ ribbon }}\" as=\"day\" hint-placeholder-count=\"30\">\n        <div sc-camel-on-click=\"{{ day.onClick }}\" style=\"{{ day.style }}\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n            <span style=\"{{ day.wdStyle }}\">{{ day.wd }}<\u002Fspan>\n            <sc-if value=\"{{ day.isToday }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font:700 8px/1 JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#FFF9F4;background:#14110F;padding:4px 6px;white-space:nowrap\">Today<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <span style=\"{{ day.numStyle }}\">{{ day.n }}<\u002Fspan>\n          <sc-if value=\"{{ day.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ day.listStyle }}\">\n              <sc-for list=\"{{ day.events }}\" as=\"ev\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;flex-direction:column;gap:5px;padding:14px 16px;background:#1E1A17;border:1px solid rgba(250,237,225,.16)\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                    <span style=\"{{ ev.kindStyle }}\">{{ ev.kind }}<\u002Fspan>\n                    <span style=\"font:500 11px JetBrains Mono,monospace;color:#B8ADA4;white-space:nowrap\">{{ ev.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <h3 style=\"margin:0;font:600 18px/1.2 Bricolage Grotesque,sans-serif;letter-spacing:-.015em;color:#FFF9F4\">{{ ev.title }}<\u002Fh3>\n                  <span style=\"font:400 12px/1.45 Karla,sans-serif;color:#B8ADA4\">{{ ev.venue }}<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px\">\n                    <span style=\"font:500 10px JetBrains Mono,monospace;color:#8A7F76;white-space:nowrap\">{{ ev.goingLabel }}<\u002Fspan>\n                    <span sc-camel-on-click=\"{{ ev.onGoing }}\" style=\"{{ ev.btnStyle }}\">{{ ev.btnLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <span style=\"{{ day.countStyle }}\">{{ day.countLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div id=\"list\" style=\"padding:0 44px 46px;display:grid;grid-template-columns:1.05fr .95fr;gap:1px;background:rgba(20,17,15,.18)\">\n    <div style=\"background:linear-gradient(105deg,#DA612E,#F4A46B);padding:44px 42px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:500 11px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#FFE7D6\">Run something?<\u002Fspan>\n      <h2 style=\"margin:0;font:800 46px/.94 Bricolage Grotesque,sans-serif;letter-spacing:-.035em;color:#FFF9F4\">Pin it to<br>the board<\u002Fh2>\n      <p style=\"margin:0;max-width:400px;font:400 17px/1.6 Karla,sans-serif;color:#FFEFE3\">Club night, craft group, support circle, choir — free to list, always.<\u002Fp>\n      <span style=\"margin-top:8px;padding:15px 26px;background:#14110F;color:#F4A46B;font:600 15px Karla,sans-serif;align-self:flex-start\">List your event<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#14110F;padding:44px 42px;display:flex;flex-direction:column;gap:14px;justify-content:center\">\n      <span style=\"font:500 11px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#F4A46B\">Never miss one<\u002Fspan>\n      <h2 style=\"margin:0;font:800 38px/.98 Bricolage Grotesque,sans-serif;letter-spacing:-.035em;color:#FFF9F4\">A quiet weekly email<\u002Fh2>\n      <p style=\"margin:0;font:400 17px/1.6 Karla,sans-serif;color:#B8ADA4\">What's on near you, once a week. Nothing else, ever.<\u002Fp>\n      <div style=\"display:flex;gap:10px;margin-top:8px\">\n        <span style=\"flex:1;padding:16px 18px;background:#241F1B;border:1px solid rgba(242,238,231,.2);font:400 16px Karla,sans-serif;color:#8A7F76\">you@email.com<\u002Fspan>\n        <span style=\"padding:16px 26px;background:#F4A46B;color:#14110F;font:700 16px Karla,sans-serif\">Notify me<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFF9F4;border-top:1px solid rgba(20,17,15,.18);padding:34px 44px;display:flex;align-items:center;justify-content:space-between;gap:30px\">\n    <div style=\"display:flex;align-items:center;gap:20px\">\n      <a href=\"index.html\" style=\"display:flex;align-items:center;text-decoration:none\">\n        <img src=\"2d8ba034-2cb8-4e1d-ae00-7c424d7c7179\" alt=\"Queer Connected\" style=\"height:48px;width:auto\">\n      <\u002Fa>\n      <span style=\"font:400 13px/1.6 Karla,sans-serif;color:#9A6A4C\">© 2026 Queer Connected<br>queerconnected.com<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:22px;font:500 11px JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:#3B332D\">\n      <a href=\"index.html\" style=\"color:inherit;text-decoration:none\">Home<\u002Fa><span>About<\u002Fspan><a href=\"events.html\" style=\"color:inherit;text-decoration:none\">Events<\u002Fa><span>FAQs<\u002Fspan><span>Contact<\u002Fspan><span>Instagram<\u002Fspan><span>TikTok<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500},&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;month&quot;,&quot;ribbon&quot;],&quot;default&quot;:&quot;month&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showPastDays&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst TODAY = new Date();\nconst CUR_Y = TODAY.getFullYear(), CUR_M = TODAY.getMonth(), CUR_D = TODAY.getDate();\nconst NEXT_Y = CUR_M === 11 ? CUR_Y + 1 : CUR_Y;\nconst NEXT_M = (CUR_M + 1) % 12;\nfunction monthMeta(y, m, todayDay) {\n  return {\n    label: `${MONTH_SHORT[m]} ${y}`,\n    short: MONTH_SHORT[m],\n    full: MONTH_FULL[m],\n    days: new Date(y, m + 1, 0).getDate(),\n    lead: (new Date(y, m, 1).getDay() + 6) % 7,\n    today: todayDay\n  };\n}\nconst MONTHS = [\n  monthMeta(CUR_Y, CUR_M, CUR_D),\n  monthMeta(NEXT_Y, NEXT_M, null)\n];\nconst EVENTS = [\n  {m:0,d:1,kind:'Group',title:'Soft Hands Bouldering',time:'19:00',venue:'The Arch, Unit 4',access:'Step-free · beginners',going:9},\n  {m:0,d:3,kind:'Event',title:'Sober queer karaoke',time:'19:00',venue:'Rose & Crown, back room',access:'BSL interpreter',going:14},\n  {m:0,d:5,kind:'Event',title:'Slow morning lake swim',time:'09:30',venue:'Hollow Pond, east gate',access:'All speeds · dogs welcome',going:10},\n  {m:0,d:5,kind:'Social',title:'Zine-making, no skill needed',time:'15:00',venue:'Peckham Print Room',access:'£4 materials · step-free',going:22},\n  {m:0,d:8,kind:'Group',title:'Soft Hands Bouldering',time:'19:00',venue:'The Arch, Unit 4',access:'Step-free · beginners',going:9},\n  {m:0,d:9,kind:'Social',title:'Trans+ book swap',time:'18:30',venue:'Gay’s The Word',access:'Quiet room available',going:17},\n  {m:0,d:10,kind:'Event',title:'Open mic — new voices',time:'20:00',venue:'The Glory, upstairs',access:'Stairs only',going:31},\n  {m:0,d:11,kind:'Social',title:'Film club: double bill',time:'19:30',venue:'Rio Cinema, screen 2',access:'Captioned',going:26},\n  {m:0,d:12,kind:'Event',title:'Pride picnic in the park',time:'12:00',venue:'London Fields, by the oak',access:'Free · step-free',going:58},\n  {m:0,d:12,kind:'Group',title:'Beginners’ choir rehearsal',time:'16:00',venue:'St Mary’s hall',access:'No audition',going:12},\n  {m:0,d:12,kind:'Social',title:'Late night: house & disco',time:'22:00',venue:'Dalston Superstore',access:'18+ · ID needed',going:44},\n  {m:0,d:13,kind:'Group',title:'Sunday run club, 5k',time:'10:00',venue:'Victoria Park gates',access:'Walkers welcome',going:16},\n  {m:0,d:15,kind:'Group',title:'Soft Hands Bouldering',time:'19:00',venue:'The Arch, Unit 4',access:'Step-free · beginners',going:9},\n  {m:0,d:16,kind:'Social',title:'Crochet & complain',time:'18:30',venue:'Common Press',access:'Step-free',going:11},\n  {m:0,d:17,kind:'Event',title:'Craft night: lino printing',time:'18:00',venue:'Peckham Print Room',access:'£4 materials',going:19},\n  {m:0,d:18,kind:'Social',title:'Bi+ pub quiz',time:'19:30',venue:'The Eagle',access:'Step-free',going:24},\n  {m:0,d:19,kind:'Event',title:'Lake swim + flask of tea',time:'09:30',venue:'Hollow Pond, east gate',access:'All speeds',going:13},\n  {m:0,d:19,kind:'Social',title:'Karaoke round two',time:'20:00',venue:'Rose & Crown',access:'BSL interpreter',going:21},\n  {m:0,d:20,kind:'Group',title:'Support circle (closed)',time:'15:00',venue:'Community room 2',access:'Members only',going:8},\n  {m:0,d:24,kind:'Event',title:'Zine fair',time:'17:00',venue:'Hackney Showroom',access:'Free · step-free',going:37},\n  {m:0,d:26,kind:'Social',title:'Roller disco',time:'19:00',venue:'Lea Valley rink',access:'Skate hire £5',going:29},\n  {m:0,d:27,kind:'Group',title:'Sunday run club, 5k',time:'10:00',venue:'Victoria Park gates',access:'Walkers welcome',going:16},\n  {m:0,d:30,kind:'Social',title:'Book swap',time:'18:30',venue:'Gay’s The Word',access:'Quiet room available',going:17},\n  {m:1,d:1,kind:'Event',title:'Autumn lantern walk',time:'18:00',venue:'Walthamstow Wetlands',access:'Step-free path',going:20},\n  {m:1,d:3,kind:'Group',title:'Sunday run club, 5k',time:'10:00',venue:'Victoria Park gates',access:'Walkers welcome',going:16},\n  {m:1,d:6,kind:'Group',title:'Soft Hands Bouldering',time:'19:00',venue:'The Arch, Unit 4',access:'Step-free · beginners',going:9},\n  {m:1,d:10,kind:'Social',title:'Queer horror movie night',time:'20:00',venue:'Rio Cinema, screen 2',access:'Captioned',going:33},\n  {m:1,d:10,kind:'Event',title:'Clothes swap & mend',time:'13:00',venue:'Common Press',access:'Free · step-free',going:27},\n  {m:1,d:17,kind:'Event',title:'Trans joy photo studio',time:'11:00',venue:'Hackney Showroom',access:'Book a slot',going:41},\n  {m:1,d:24,kind:'Social',title:'Karaoke: Halloween edition',time:'20:00',venue:'Rose & Crown',access:'BSL interpreter',going:35},\n  {m:1,d:31,kind:'Social',title:'All Hallows house party',time:'21:00',venue:'Dalston Superstore',access:'18+ · ID needed',going:52}\n];\nconst WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\nconst KIND = { Event: {fg:'#D95F2B', dark:'#F4A46B'}, Group: {fg:'#A8451C', dark:'#EC9059'}, Social: {fg:'#7A3212', dark:'#FFD9BC'} };\nconst tint = c => c === 0 ? '#FFF9F4' : c === 1 ? '#FBD9C1' : c === 2 ? '#F4A46B' : '#DA612E';\n\nclass Component extends DCLogic {\n  state = { view: null, month: 0, day: null, ribbonDay: null, going: {} };\n\n  get view() { return this.state.view || this.props.defaultView || 'month'; }\n  get showPast() { return this.props.showPastDays ?? true; }\n\n  ev(id) { return `${this.state.month}-${id}`; }\n  events(d) { return EVENTS.filter(e => e.m === this.state.month && e.d === d); }\n  wdOf(d) { return WD[(MONTHS[this.state.month].lead + d - 1) % 7]; }\n\n  card(e, dark) {\n    const key = `${e.m}-${e.d}-${e.title}`;\n    const on = !!this.state.going[key];\n    return {\n      kind: e.kind, time: e.time, title: e.title, venue: e.venue, access: e.access,\n      kindStyle: `align-self:flex-start;font:700 9px/1 JetBrains Mono,monospace;letter-spacing:.14em;text-transform:uppercase;padding:5px 7px;color:${dark ? KIND[e.kind].dark : KIND[e.kind].fg};background:${dark ? 'rgba(250,237,225,.1)' : 'rgba(217,95,43,.1)'}`,\n      goingLabel: `${e.going + (on ? 1 : 0)} going`,\n      btnLabel: on ? \"You're going ✓\" : 'Going?',\n      btnStyle: on\n        ? `padding:8px 14px;font:700 12px Karla,sans-serif;cursor:pointer;border:1px solid transparent;background:${dark ? '#F4A46B' : '#14110F'};color:${dark ? '#14110F' : '#F4A46B'}`\n        : `padding:8px 14px;font:600 12px Karla,sans-serif;cursor:pointer;background:transparent;color:${dark ? '#F4A46B' : '#D95F2B'};border:1px solid ${dark ? 'rgba(244,164,107,.5)' : 'rgba(217,95,43,.5)'}`,\n      onGoing: () => this.setState(s => ({ going: Object.assign({}, s.going, { [key]: !s.going[key] }) }))\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const M = MONTHS[st.month];\n    const total = EVENTS.filter(e => e.m === st.month).length;\n\n    const cells = [];\n    const rows = Math.ceil((M.lead + M.days) / 7);\n    for (let i = 0; i < rows * 7; i++) {\n      const n = i - M.lead + 1;\n      if (n < 1 || n > M.days) {\n        cells.push({ n: '', style: 'height:96px;background:transparent', numStyle: 'display:none', todayStyle: 'display:none', todayLabel: '', lines: [], hoverStyle: '', onClick: () => {}, moreLabel: '', moreStyle: 'display:none' });\n        continue;\n      }\n      const evs = this.events(n);\n      const sel = st.day === n;\n      const past = this.showPast && M.today !== null && n < M.today;\n      const MAX_LINES = 2;\n      const shown = evs.slice(0, MAX_LINES);\n      const extra = evs.length - shown.length;\n      cells.push({\n        n,\n        onClick: () => this.setState({ day: n }),\n        style: `height:96px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;cursor:pointer;background:${sel ? '#FDE3D2' : '#FFF9F4'};border:1px solid ${sel ? '#D95F2B' : 'rgba(20,17,15,.14)'};opacity:${past && !sel ? .5 : 1}`,\n        hoverStyle: sel ? '' : 'background:rgba(217,95,43,.1)',\n        numStyle: `font:700 15px/1 Bricolage Grotesque,sans-serif;color:${sel ? '#D95F2B' : '#14110F'}`,\n        todayLabel: n === M.today ? 'Today' : '',\n        todayStyle: n === M.today\n          ? `font:700 8px/1 JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;padding:3px 5px;white-space:nowrap;color:#FFF9F4;background:#D95F2B`\n          : 'display:none',\n        lines: shown.map(e => ({\n          time: e.time, title: e.title,\n          style: `display:flex;flex-direction:column;gap:2px;padding-left:8px;border-left:2px solid ${KIND[e.kind].fg};min-width:0`,\n          timeStyle: `font:500 9px/1 JetBrains Mono,monospace;color:#94664A`,\n          titleStyle: `font:500 11px/1.25 Karla,sans-serif;color:#5E3520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0`\n        })),\n        moreLabel: extra > 0 ? `+${extra} more` : '',\n        moreStyle: extra > 0 ? `font:600 9px/1 JetBrains Mono,monospace;letter-spacing:.06em;color:${sel ? '#D95F2B' : '#94664A'};padding-left:8px` : 'display:none'\n      });\n    }\n\n    const dayEvs = this.events(st.day);\n    const ribbon = [];\n    for (let n = 1; n <= M.days; n++) {\n      if (!this.showPast && M.today !== null && n < M.today) continue;\n      const evs = this.events(n);\n      const open = st.ribbonDay === n;\n      const past = M.today !== null && n < M.today;\n      const busy = evs.length >= 3;\n      ribbon.push({\n        n, wd: this.wdOf(n), isToday: n === M.today,\n        onClick: () => this.setState(s => ({ ribbonDay: s.ribbonDay === n ? null : n })),\n        style: `flex:none;width:${open ? (evs.length >= 3 ? 660 : 400) : (evs.length ? 138 : 78)}px;height:${open ? 372 : 264}px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;cursor:pointer;scroll-snap-align:center;background:${open ? '#14110F' : (past ? 'transparent' : tint(evs.length))};border:1px solid ${open ? '#14110F' : 'rgba(20,17,15,.18)'};opacity:${past && !open ? .55 : 1}`,\n        wdStyle: `font:500 9px/1 JetBrains Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:${open ? '#F4A46B' : (busy ? '#FFE7D6' : '#94664A')}`,\n        numStyle: `font:800 ${open ? 54 : 36}px/.9 Bricolage Grotesque,sans-serif;letter-spacing:-.04em;color:${open ? '#FFF9F4' : (busy ? '#FFF9F4' : (evs.length ? '#14110F' : '#C0A692'))}`,\n        countLabel: evs.length ? (evs.length === 1 ? '1 thing' : evs.length + ' things') : '',\n        countStyle: `margin-top:auto;font:500 9px/1.4 JetBrains Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:${open ? '#B8ADA4' : (busy ? '#FFE7D6' : '#7A3418')}`,\n        listStyle: `display:grid;grid-template-columns:repeat(${evs.length >= 3 ? 2 : 1},minmax(0,1fr));gap:9px;align-content:start;overflow-y:auto;padding-right:4px`,\n        open, events: open ? evs.map(e => this.card(e, true)) : []\n      });\n    }\n    const scrub = [];\n    for (let n = 1; n <= M.days; n++) {\n      const c = this.events(n).length;\n      const sel = st.ribbonDay === n;\n      scrub.push({\n        onClick: () => this.setState({ ribbonDay: n }),\n        style: `flex:1;height:${8 + c * 9}px;align-self:flex-end;cursor:pointer;background:${sel ? '#14110F' : (c ? '#D95F2B' : 'rgba(20,17,15,.16)')};opacity:${M.today !== null && n < M.today && !sel ? .4 : 1}`\n      });\n    }\n\n    const tab = on => `padding:11px 20px;cursor:pointer;border:1px solid ${on ? '#D95F2B' : 'rgba(20,17,15,.28)'};background:${on ? '#D95F2B' : 'transparent'};color:${on ? '#FFF9F4' : '#14110F'}`;\n\n    return {\n      weekdays: WD,\n      eyebrow: `${M.label} · ${total} things on${M.today ? ' · ' + M.today + ' ' + M.short + ' today' : ''}`,\n      monthLabel: M.label, lastDayLabel: `${M.days} ${M.short}`,\n      prevMonth: () => this.setState({ month: 0, day: null, ribbonDay: null }),\n      nextMonth: () => this.setState({ month: 1, day: null, ribbonDay: null }),\n      showMonth: () => this.setState({ view: 'month' }),\n      showRibbon: () => this.setState({ view: 'ribbon' }),\n      isMonth: this.view === 'month', isRibbon: this.view === 'ribbon',\n      tabMonthStyle: tab(this.view === 'month'),\n      tabRibbonStyle: tab(this.view === 'ribbon') + ';border-left:none',\n      cells,\n      dayLabel: st.day !== null ? `${this.wdOf(st.day)} ${st.day} ${M.full}` : '',\n      dayCount: dayEvs.length ? `${dayEvs.length} ${dayEvs.length === 1 ? 'thing' : 'things'} on` : 'Free day',\n      dayEmpty: dayEvs.length === 0,\n      hasDaySelected: st.day !== null,\n      noDaySelected: st.day === null,\n      dayEventsList: dayEvs.map((e, i) => Object.assign(this.card(e, false), {\n        trayStyle: `display:flex;flex-direction:column;gap:8px;padding:0 22px;border-left:${i === 0 ? 'none' : '1px solid rgba(20,17,15,.2)'}`\n      })),\n      ribbon, scrub,\n      ribbonLabel: st.ribbonDay ? `${this.wdOf(st.ribbonDay)} ${st.ribbonDay} ${M.short}` : 'Tap any day'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
